[project]
name = "vaultwarden-fly-io"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["boto3==1.43.6", "pydantic>=2.10,<3", "typing-extensions>=4.12"]

[dependency-groups]
dev = ["boto3-stubs[s3]==1.43.6", "mypy==1.19.1", "ruff==0.16.8"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true
files = ["vaultwarden-fly-io/backup.py", "vaultwarden-fly-io/entrypoint.py", "tests"]
mypy_path = "vaultwarden-fly-io"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
